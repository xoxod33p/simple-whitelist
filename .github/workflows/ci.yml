name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Paper Plugin with Maven
        run: |
          cd plugin
          mvn clean package --no-transfer-progress

      - name: Verify build artifact
        run: |
          test -f plugin/target/SimpleWhitelist.jar || (echo "JAR not found!" && exit 1)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Web App Syntax
        run: |
          cd webapp
          node --check server.js
